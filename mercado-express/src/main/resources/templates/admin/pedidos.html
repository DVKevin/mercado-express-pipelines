<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Todos os pedidos')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main>
    <h1>Todos os pedidos</h1>
    <table class="table">
        <thead><tr><th>#</th><th>Data</th><th>Cliente</th><th>Total</th><th>Lucro</th><th>Status</th><th>Transação</th><th></th></tr></thead>
        <tbody>
        <tr th:each="p : ${pedidos}">
            <td th:text="${p.id}"></td>
            <td th:text="${#temporals.format(p.criadoEm, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${p.usuario.nome}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(p.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(p.lucro, 1, 'POINT', 2, 'COMMA')}"></td>
            <td><span class="status" th:classappend="${'st-' + p.status}" th:text="${p.status}"></span></td>
            <td th:text="${p.codigoTransacao ?: '-'}"></td>
            <td><a th:href="@{/pedidos/{id}(id=${p.id})}" class="btn btn-sm btn-ghost">Ver</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
